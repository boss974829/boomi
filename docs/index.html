<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bhoomi</title>
  <meta name="description" content="High-resolution 3D topographic map of India." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1210'/%3E%3Cpath d='M4 22 L12 10 L18 18 L24 8 L28 22 Z' fill='none' stroke='%23e4b15a' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; background: #0c1210; }
    body { color: #f4efe6; font-family: system-ui, sans-serif; }
    .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(12, 18, 16, 0.72) !important; }
    .panel {
      position: absolute; z-index: 2; top: 14px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start;
      pointer-events: none;
    }
    .card, .places button, .slider, .readout, .proj {
      pointer-events: auto;
      background: rgba(12, 18, 16, 0.82);
      border: 1px solid rgba(228, 177, 90, 0.35);
      backdrop-filter: blur(8px);
    }
    .card { padding: 12px 14px; max-width: 280px; }
    .kicker { margin: 0; letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px; color: #c9b8a4; }
    h1 { margin: 2px 0 0; font-family: Georgia, serif; font-weight: 500; font-size: 32px; letter-spacing: -0.03em; }
    h1 span { color: #d86a2a; }
    .card p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: #efe6da; }
    .places { display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; }
    .places button, .slider, .proj {
      color: #f4efe6; border-radius: 999px; padding: 8px 12px; font: 500 13px system-ui, sans-serif; cursor: pointer;
    }
    .places button.on, .proj.on { background: #e4b15a; color: #0c1210; border-color: #e4b15a; }
    .dock {
      position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 28px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .slider { display: flex; align-items: center; gap: 10px; }
    .slider input { width: 140px; accent-color: #e4b15a; }
    .readout { margin-left: auto; padding: 8px 12px; border-radius: 999px; font-size: 13px; color: #efe6da; }
    .status { position: absolute; z-index: 2; left: 14px; bottom: 78px; font-size: 12px; color: #f0c9a0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div class="card">
      <p class="kicker">Field atlas · India</p>
      <h1>Bh<span>oo</span>mi</h1>
      <p id="blurb">A peninsula pinned under the Himalaya. The north is a wall of rock, the interior a tilted plateau, the coasts a thin plain.</p>
    </div>
    <div class="places" id="places"></div>
  </div>
  <div class="dock">
    <label class="slider">Relief
      <input id="exag" type="range" min="1" max="3.5" step="0.1" value="1.4" />
      <span id="exag-label">1.4×</span>
    </label>
    <button class="proj" id="proj" type="button" aria-pressed="false">Globe</button>
    <div class="readout" id="elev">Elevation —</div>
  </div>
  <p class="status" id="status" hidden></p>
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script>
    const PLACES = [
      { id: "land", name: "The subcontinent", lng: 79.0, lat: 22.8, zoom: 4.7, pitch: 18, bearing: -8, text: "A peninsula pinned under the Himalaya. The north is a wall of rock, the interior a tilted plateau, the coasts a thin plain." },
      { id: "kangchenjunga", name: "Kangchenjunga", lng: 88.1475, lat: 27.7025, zoom: 12.2, pitch: 12, bearing: -12, text: "Surveyed summit 8,586 m, at 27.7025°N 88.1475°E on the Sikkim–Nepal border." },
      { id: "nanda", name: "Nanda Devi", lng: 79.9708, lat: 30.3768, zoom: 12.2, pitch: 12, bearing: 8, text: "Surveyed summit 7,816 m, at 30.3768°N 79.9708°E. The highest peak standing entirely inside India." },
      { id: "ladakh", name: "Ladakh", lng: 77.577, lat: 34.164, zoom: 9.5, pitch: 22, bearing: -16, text: "The Indus valley at Leh, between the Ladakh and Zanskar ranges. Valley floors sit near 3,500 m." },
      { id: "ghats", name: "Western Ghats", lng: 75.28, lat: 13.35, zoom: 10.5, pitch: 24, bearing: -24, text: "The Arabian escarpment near Kudremukh. The crest faces the sea; the plateau behind it is drier." },
      { id: "deccan", name: "Deccan", lng: 76.4, lat: 18.52, zoom: 7.4, pitch: 24, bearing: -8, text: "Flood basalt, tilted. The west stands higher; rivers drain east toward the Bay of Bengal." },
      { id: "thar", name: "Thar", lng: 71.0, lat: 26.9, zoom: 8.2, pitch: 28, bearing: 10, text: "Dunes and salt playas west of the Aravalli. The range holds most of the monsoon on its eastern side." },
      { id: "sundarbans", name: "Sundarbans", lng: 88.8, lat: 21.95, zoom: 10.2, pitch: 28, bearing: -10, text: "Mangrove creeks of the Ganga–Brahmaputra delta, barely above the tide." }
    ];
    const PEAKS = [
      ["Kangchenjunga", 88.1475, 27.7025],
      ["Nanda Devi", 79.9708, 30.3768],
      ["Anamudi", 77.0614, 10.1698],
      ["Kamet", 79.7747, 30.9198]
    ];
    const DEM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
    const SAT = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
    const ROADS = "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}";
    const LABELS = "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}";
    const STATES = "https://raw.githubusercontent.com/boss974829/boomi/main/public/india-states.geojson";

    const start = PLACES[0];
    const map = new maplibregl.Map({
      container: "map",
      pixelRatio: 2,
      fadeDuration: 0,
      maxZoom: 17,
      minZoom: 3,
      maxPitch: 72,
      antialias: true,
      canvasContextAttributes: { antialias: true },
      style: {
        version: 8,
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        projection: { type: "mercator" },
        light: { anchor: "map", position: [1.5, 210, 40], color: "#fff6ea", intensity: 0.45 },
        terrain: { source: "dem", exaggeration: 1.4 },
        sources: {
          dem: { type: "raster-dem", tiles: [DEM], encoding: "terrarium", tileSize: 256, maxzoom: 15 },
          shade: { type: "raster-dem", tiles: [DEM], encoding: "terrarium", tileSize: 256, maxzoom: 15 },
          satellite: { type: "raster", tiles: [SAT], tileSize: 256, maxzoom: 19, attribution: "Imagery: Esri, Maxar, Earthstar Geographics · Elevation: AWS Terrain Tiles / SRTM" },
          roads: { type: "raster", tiles: [ROADS], tileSize: 256, maxzoom: 19 },
          labels: { type: "raster", tiles: [LABELS], tileSize: 256, maxzoom: 19 },
          states: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
          peaks: {
            type: "geojson",
            data: { type: "FeatureCollection", features: PEAKS.map(([name, lng, lat]) => ({ type: "Feature", properties: { name }, geometry: { type: "Point", coordinates: [lng, lat] } })) }
          }
        },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0c1210" } },
          { id: "satellite", type: "raster", source: "satellite", paint: { "raster-resampling": "linear", "raster-fade-duration": 0, "raster-saturation": 0.05, "raster-contrast": 0.04 } },
          { id: "hillshade", type: "hillshade", source: "shade", paint: { "hillshade-illumination-direction": 210, "hillshade-illumination-altitude": 45, "hillshade-exaggeration": 0.22, "hillshade-shadow-color": "#1a1612", "hillshade-highlight-color": "#fff8ee" } },
          { id: "states-line", type: "line", source: "states", paint: { "line-color": "#e4b15a", "line-width": ["interpolate", ["linear"], ["zoom"], 4, 0.6, 8, 1.1, 12, 1.6], "line-opacity": 0.7 } },
          { id: "roads", type: "raster", source: "roads", minzoom: 8, paint: { "raster-opacity": 0.85, "raster-fade-duration": 0 } },
          { id: "labels", type: "raster", source: "labels", paint: { "raster-fade-duration": 0 } },
          { id: "peaks", type: "circle", source: "peaks", paint: { "circle-radius": 3.5, "circle-color": "#e4b15a", "circle-stroke-width": 1, "circle-stroke-color": "#0c1210" } },
          { id: "peak-names", type: "symbol", source: "peaks", minzoom: 8, layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 13, "text-offset": [0, 0.8], "text-anchor": "top" }, paint: { "text-color": "#f4efe6", "text-halo-color": "#0c1210", "text-halo-width": 1.4 } }
        ]
      },
      center: [start.lng, start.lat],
      zoom: start.zoom,
      pitch: start.pitch,
      bearing: start.bearing,
      attributionControl: true
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

    const placesEl = document.getElementById("places");
    const blurb = document.getElementById("blurb");
    const statusEl = document.getElementById("status");
    const elev = document.getElementById("elev");
    let current = start.id;
    let globe = false;

    function drawPlaces() {
      placesEl.innerHTML = PLACES.map((place) => `<button type="button" data-id="${place.id}" class="${place.id === current ? "on" : ""}">${place.name}</button>`).join("");
    }
    function showElevation(lngLat) {
      const meters = map.queryTerrainElevation(lngLat);
      elev.textContent = meters == null ? "Elevation —" : `Elevation ${Math.round(meters).toLocaleString()} m`;
    }
    placesEl.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const place = PLACES.find((item) => item.id === button.dataset.id);
      current = place.id;
      blurb.textContent = place.text;
      drawPlaces();
      map.flyTo({ center: [place.lng, place.lat], zoom: place.zoom, pitch: place.pitch, bearing: place.bearing, duration: 1600, essential: true });
    });
    drawPlaces();

    const exag = document.getElementById("exag");
    const exagLabel = document.getElementById("exag-label");
    exag.addEventListener("input", () => {
      const value = Number(exag.value);
      exagLabel.textContent = value.toFixed(1) + "×";
      map.setTerrain({ source: "dem", exaggeration: value });
    });

    const proj = document.getElementById("proj");
    proj.addEventListener("click", () => {
      globe = !globe;
      map.setProjection({ type: globe ? "globe" : "mercator" });
      proj.classList.toggle("on", globe);
      proj.setAttribute("aria-pressed", globe ? "true" : "false");
      proj.textContent = globe ? "Flat" : "Globe";
    });

    map.on("mousemove", (event) => showElevation(event.lngLat));
    map.on("moveend", () => showElevation(map.getCenter()));
    map.on("load", () => {
      fetch(STATES)
        .then((res) => { if (!res.ok) throw new Error(String(res.status)); return res.json(); })
        .then((data) => map.getSource("states").setData(data))
        .catch(() => { statusEl.hidden = false; statusEl.textContent = "State borders did not load. The terrain is still live."; });
      showElevation(map.getCenter());
    });
    map.on("error", (event) => {
      const message = event && event.error ? event.error.message : "";
      if (statusEl.hidden && message && !/tile|ajax|image/i.test(message)) {
        statusEl.hidden = false;
        statusEl.textContent = "The map hit a display error. Reload once.";
      }
    });
  </script>
</body>
</html>
